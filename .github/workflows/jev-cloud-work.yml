name: Jev client integration verification
on:
  push:
    branches: [wip/auto-review-jev-client]
    paths:
      - .github/workflows/jev-cloud-work.yml
      - .wip/auto-review-jev/ci/**
permissions:
  contents: read
concurrency:
  group: jev-client-integration-${{ github.ref }}
  cancel-in-progress: true
env:
  XDT_SKIP_AGENT_BIN_INSTALL: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  ELECTRON_OVERRIDE_DIST_PATH: '${{ github.workspace }}/.electron-stub-dist'
  NODE_OPTIONS: '--max-old-space-size=8192'
jobs:
  verify:
    if: github.repository == 'anyerqi/cindy' && github.ref == 'refs/heads/wip/auto-review-jev-client'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Apply integration to real application sources
        run: |
          mkdir -p "$RUNNER_TEMP/jev-logs"
          node .wip/auto-review-jev/ci/complete.mjs
          node scripts/design-inventory.mjs
          git add -- apps packages docs
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/jev-logs/integration.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        with:
          name: jev-applied-source
          path: ${{ runner.temp }}/jev-logs/integration.patch
          retention-days: 2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          status=0
          pnpm install --frozen-lockfile > "$RUNNER_TEMP/jev-logs/install.log" 2>&1 || status=$?
          tail -60 "$RUNNER_TEMP/jev-logs/install.log"
          exit "$status"
      - name: Install test runtime and Linux fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install:ripgrep
          sudo apt-get update -qq
          sudo apt-get install --yes libarchive-tools binutils desktop-file-utils xdg-utils
      - name: Validate translations, endpoints, and design inventory
        run: |
          pnpm check:i18n
          pnpm check:i18n-glossary
          pnpm check:endpoints
          pnpm check:design-inventory
      - name: Core reviewer regression tests
        run: |
          status=0
          pnpm --filter @cindy/maker-core exec vitest run --maxWorkers=1 --minWorkers=1 src/agents/shared/auto-review-runtime-policy.test.ts src/agents/claude-code/__tests__/auto-review-wiring.test.ts src/agents/codex/index.test.ts src/agents/pi/__tests__/pi-auto-review-dispatch.test.ts > "$RUNNER_TEMP/jev-logs/core-targeted.log" 2>&1 || status=$?
          tail -100 "$RUNNER_TEMP/jev-logs/core-targeted.log"
          exit "$status"
      - name: Desktop reviewer, credentials, and settings UI tests
        run: |
          status=0
          pnpm --filter desktop exec vitest run --maxWorkers=1 --minWorkers=1 src/main/maker-host/auto-review/__tests__ src/main/maker-host/__tests__/autoPermissionReviewer.test.ts src/main/maker-host/__tests__/autoReviewModelRouter.test.ts src/main/secrets/__tests__/providerSecretStore.test.ts src/renderer/components/settings/__tests__/AutoReviewSection.test.tsx > "$RUNNER_TEMP/jev-logs/desktop-targeted.log" 2>&1 || status=$?
          tail -100 "$RUNNER_TEMP/jev-logs/desktop-targeted.log"
          exit "$status"
      - name: Core typecheck
        run: |
          pnpm --filter @cindy/maker-core run --if-present typecheck
          status=0
          pnpm --filter @cindy/maker-core build > "$RUNNER_TEMP/jev-logs/core-types.log" 2>&1 || status=$?
          tail -100 "$RUNNER_TEMP/jev-logs/core-types.log"
          exit "$status"
      - name: Desktop typecheck
        run: |
          status=0
          pnpm --filter desktop run --if-present typecheck > "$RUNNER_TEMP/jev-logs/desktop-types.log" 2>&1 || status=$?
          tail -100 "$RUNNER_TEMP/jev-logs/desktop-types.log"
          exit "$status"
      - name: Required repository related-unit gate
        run: |
          status=0
          pnpm test:unit:related > "$RUNNER_TEMP/jev-logs/related-unit.log" 2>&1 || status=$?
          tail -150 "$RUNNER_TEMP/jev-logs/related-unit.log"
          exit "$status"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-validation-results
          path: ${{ runner.temp }}/jev-logs
          retention-days: 2
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reproduce validated sources and retire draft staging
        run: |
          node .wip/auto-review-jev/ci/complete.mjs
          node scripts/design-inventory.mjs
          git rm -r -- .wip/auto-review-jev
          git add -- apps packages docs
          git diff --cached --check
          git config user.name hunter
          git config user.email lmnghu@outlook.com
          git commit -s -m "feat(auto-review): integrate optional client-side Jev provider" -m "Add settings and encrypted BYOK credentials, direct TypeSafe requests, native reviewer selection, and revision-aware caches. Keep original review behavior by default. No server or gateway changes. Validated by targeted tests, core and desktop typechecks, and the repository related-unit gate on GitHub-hosted Linux. Live Jev judgments and real desktop keychain/UI remain unverified."
      - name: Push only the task branch without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/wip/auto-review-jev-client
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
